# BahriApp v1.1 — TLS terminator for the local development stack.
#
# The client refuses plain HTTP unless built with BAHRI_ALLOW_INSECURE=true,
# so even a local backend is reached over TLS. Generate a self-signed
# certificate first:
#
#   mkdir -p certs && openssl req -x509 -newkey rsa:2048 -nodes \
#     -keyout certs/server.key -out certs/server.crt -days 365 \
#     -subj "/CN=localhost"

server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # TLS 1.2 floor, 1.3 preferred.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # Behavioural payloads can be large; keep the cap generous but finite.
    client_max_body_size 32m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass         http://api:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;

        # The Authorization and Idempotency-Key headers the v1.1 client sends
        # are forwarded by default; named here so their role is explicit.
        proxy_pass_request_headers on;

        proxy_read_timeout 60s;
    }
}
